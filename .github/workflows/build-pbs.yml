name: Build and push PBS docker image

# Only run if there have been changes to code in `ci` directory
on:
  push:
    branches:
      - dev
    paths:
      - "ci/**"
      - ".github/workflows/build-pbs.yml"
  pull_request:
    paths:
      - "ci/**"
      - ".github/workflows/build-pbs.yml"
  workflow_dispatch:

jobs:
  build-and-push-pbs-docker:
    permissions:
      contents: "read"
      packages: "write"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Docker auth
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Use latest tag, as this is just for PBS used for testing
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ci/
          file: ci/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/garvan-data-science-platform/pbs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
